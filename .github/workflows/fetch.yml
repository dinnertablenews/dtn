name: Fetch headlines
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q feedparser requests pyyaml trafilatura googlenewsdecoder
      - run: |
          python fetch.py 2> /tmp/fetch.log || true
          echo "::notice title=fetch::$(tr '\n' ' ' < /tmp/fetch.log | cut -c1-900)"
      - name: Commit
        run: |
          git config user.name "dtn-bot"
          git config user.email "bot@dinnertablenews.com"
          git add data/headlines.json data/articles.json
          git diff --cached --quiet || git commit -m "headlines $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin main || true
          git push
