name: Site
on:
  push:
    branches: [main]
    # A post reaches the web when publish.py pushes its published.json, so that push is
    # the trigger. Nothing else in posts/ moves the site.
    paths:
      - "posts/**/published.json"
      - "posts/**/post.json"
      - "posts/**/1-cover.jpg"
      - "site.py"
      - "fonts/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:
  # publish.py's commit is what flips a post to published, and publish.yml pushes it with
  # actions/checkout's GITHUB_TOKEN. GitHub suppresses workflow triggers from that token to
  # stop workflows recursing, so the one commit that matters most here cannot fire the push
  # trigger above. Waiting on the Instagram workflow instead catches it.
  workflow_run:
    workflows: ["Instagram"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half-way; let the queue drain in order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # site.py is standard library only — nothing to install, no Chromium.
      # Pages has to be switched on by hand once, under Settings -> Pages -> Source:
      # GitHub Actions. This step's `enablement: true` cannot do it: GITHUB_TOKEN gets
      # "Resource not accessible by integration" on the create-Pages-site call whatever
      # permissions the workflow asks for. The build needs nothing from this step.
      - uses: actions/configure-pages@v5
      - name: Build
        # site.py knows the domain and writes the CNAME file the custom domain needs.
        run: python site.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
        id: deploy
