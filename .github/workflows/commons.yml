name: Commons image
on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Wikipedia article title, e.g. Dario Amodei"
        required: true
      slug:
        description: "file slug (optional)"
        required: false
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: Lookup and commit
        shell: bash
        run: |
          set +e
          python commons.py "${{ inputs.subject }}" "${{ inputs.slug }}" > /tmp/py.out 2>&1; rc=$?
          echo "::notice title=commons.py rc=$rc::$(tr '\n' ' ' < /tmp/py.out | tail -c 900)"
          git config user.name "dtn-bot"; git config user.email "bot@dinnertablenews.com"
          git add -A data/images > /tmp/git.out 2>&1
          git diff --cached --quiet || git commit -m "image: ${{ inputs.subject }}" >> /tmp/git.out 2>&1
          git pull --rebase origin main >> /tmp/git.out 2>&1
          git push origin HEAD:main >> /tmp/git.out 2>&1; prc=$?
          echo "::notice title=git rc=$prc::$(tr '\n' ' ' < /tmp/git.out | tail -c 900)"
          exit 0
